<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Air Canvas - Anti Glitch T515 Edition</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #111111; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
        }
        #container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        video { 
            transform: scaleX(-1); 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0.35; 
            z-index: 1;
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            transform: scaleX(-1); 
            z-index: 2;
        }
        #menu { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 12px; 
            background: rgba(255, 255, 255, 0.2); 
            padding: 10px 20px; 
            border-radius: 50px; 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            z-index: 10; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 2px solid white; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #red    { background: #FF3333; box-shadow: 0 0 10px #FF3333; }
        #orange { background: #FF9933; box-shadow: 0 0 10px #FF9933; }
        #yellow { background: #FFFF33; box-shadow: 0 0 10px #FFFF33; }
        #green  { background: #33FF33; box-shadow: 0 0 10px #33FF33; }
        #cyan   { background: #33FFFF; box-shadow: 0 0 10px #33FFFF; }
        #blue   { background: #3333FF; box-shadow: 0 0 10px #3333FF; }
        #purple { background: #9933FF; box-shadow: 0 0 10px #9933FF; }
        #pink   { background: #FF3399; box-shadow: 0 0 10px #FF3399; }
        #eraser { background: #444444; border-color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        #clear  { background: #222222; border-color: #FF3333; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        #status { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            color: white; 
            background: rgba(0, 0, 0, 0.8); 
            padding: 12px 24px; 
            border-radius: 30px; 
            font-weight: 500;
            z-index: 10; 
            border: 1px solid rgba(255,255,255,0.15);
        }
        #calibrateBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #ff3399;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,51,153,0.4);
        }
    </style>
</head>
<body>

<div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="paintCanvas"></canvas>
    
    <div id="menu">
        <div class="btn" id="red" onclick="setColor('#FF3333', 'Neon Red')"></div>
        <div class="btn" id="orange" onclick="setColor('#FF9933', 'Neon Orange')"></div>
        <div class="btn" id="yellow" onclick="setColor('#FFFF33', 'Neon Yellow')"></div>
        <div class="btn" id="green" onclick="setColor('#33FF33', 'Neon Green')"></div>
        <div class="btn" id="cyan" onclick="setColor('#33FFFF', 'Neon Cyan')"></div>
        <div class="btn" id="blue" onclick="setColor('#3333FF', 'Neon Blue')"></div>
        <div class="btn" id="purple" onclick="setColor('#9933FF', 'Neon Purple')"></div>
        <div class="btn" id="pink" onclick="setColor('#FF3399', 'Neon Pink')"></div>
        <div class="btn" id="eraser" onclick="setEraser()">🧼</div>
        <div class="btn" id="clear" onclick="clearCanvas()">❌</div>
    </div>

    <div id="status">Put color cap on finger -> Tap Calibrate -> Hold in screen center</div>
    <button id="calibrateBtn" onclick="startCalibration()">🎯 Calibrate Color</button>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

let currentColor = '#FF3333'; 
let currentThickness = 8;
let lastX = 0, lastY = 0;
let wasTracking = false;

// Setup default tracking colors (Optimized target bounds)
let targetR = 0, targetG = 180, targetB = 255; // Defaults to a strong bright neon color template
let colorThreshold = 35; // Lower values mean tighter checking (prevents background noise matching)
let isCalibrating = false;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 8;
    ctx.shadowColor = currentColor;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setColor(hexColor, name) {
    currentColor = hexColor;
    currentThickness = 8;
    ctx.shadowBlur = 8;
    ctx.shadowColor = currentColor;
    statusDiv.innerText = `Active Color: ${name}`;
}

function setEraser() {
    currentColor = '#111111'; 
    currentThickness = 60;     
    ctx.shadowBlur = 0;
    statusDiv.innerText = "Active Tool: Eraser Pad";
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    statusDiv.innerText = "Canvas Cleared!";
}

function startCalibration() {
    isCalibrating = true;
    statusDiv.innerText = "🎯 Tracking Calibration Locked! Place target color spot at center...";
}

function processFrame() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 160; 
        tempCanvas.height = 120;
        const tempCtx = tempCanvas.getContext('2d');
        
        tempCtx.translate(tempCanvas.width, 0);
        tempCtx.scale(-1, 1);
        tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
        
        const frameData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = frameData.data;
        
        let sumX = 0, sumY = 0, count = 0;
        
        if (isCalibrating) {
            const midIdx = ((tempCanvas.height / 2) * tempCanvas.width + (tempCanvas.width / 2)) * 4;
            targetR = data[midIdx];
            targetG = data[midIdx + 1];
            targetB = data[midIdx + 2];
            isCalibrating = false;
            statusDiv.innerText = "Calibration Done! Ready to Draw.";
        }

        for (let y = 0; y < tempCanvas.height; y++) {
            for (let x = 0; x < tempCanvas.width; x++) {
                const idx = (y * tempCanvas.width + x) * 4;
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                
                const dist = Math.sqrt((r - targetR)**2 + (g - targetG)**2 + (b - targetB)**2);
                if (dist < colorThreshold) {
                    sumX += x;
                    sumY += y;
                    count++;
                }
            }
        }
        
        // 🔥 ANTI-GLITCH SAFETY MECHANISMS STAGE
        // Limits tracking strictly between 15 pixels (finger point) and 400 pixels (ignores background wall blocks)
        if (count > 15 && count < 400) {
            const posX = (sumX / count) / tempCanvas.width * canvas.width;
            const posY = (sumY / count) / tempCanvas.height * canvas.height;
            
            if (wasTracking) {
                // Ignore sudden glitched teleports across the screen greater than 180 pixels
                const jumpDistance = Math.sqrt((posX - lastX)**2 + (posY - lastY)**2);
                
                if (jumpDistance < 180) {
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(posX, posY);
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentThickness;
                    ctx.stroke();
                }
            }
            
            lastX = posX;
            lastY = posY;
            wasTracking = true;
        } else {
            wasTracking = false;
        }
    }
    requestAnimationFrame(processFrame);
}

async function initSystem() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 640, height: 480 },
            audio: false
        });
        video.srcObject = stream;
        video.play();
        requestAnimationFrame(processFrame);
    } catch (err) {
        statusDiv.innerText = "⚠️ Camera Blocked! Open device permissions settings panels.";
    }
}

window.onload = initSystem;
</script>

</body>
</html>
